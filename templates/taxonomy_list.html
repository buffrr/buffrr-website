{% extends "base.html" %}

{% block title %}{{ taxonomy.name | capitalize }} &middot; {{ config.title }}{% endblock %}

{% block content %}
  <h1>{{ taxonomy.name | capitalize }}</h1>
  <ul class="post-list">
    {% for term in terms %}
      <li>
        <a href="{{ term.permalink | safe }}">#{{ term.name }}</a>
        <span>({{ term.pages | length }})</span>
      </li>
    {% endfor %}
  </ul>
{% endblock %}
